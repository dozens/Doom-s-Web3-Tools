<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realm of Aetherion - Calculator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121824;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .fallback-container {
      display: none;
      box-sizing: border-box;
      padding: 40px 20px;
      text-align: center;
      max-width: 500px;
      margin: 40px auto;
      background-color: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <iframe 
    id="calcFrame"
    src="https://script.google.com/macros/s/AKfycbytOd0--TxiyZV9K1-c2S7DZhd6q_Ckx9Le03KR5hpGmaTuBFP---AyMnudyKUSZWkdig/exec" 
    allow="clipboard-write">
  </iframe>

  <div id="fallbackBox" class="fallback-container">
    <h2>Mobile Browser Notice</h2>
    <p>If your mobile browser blocks embedded Google scripts, tap below to open the calculator directly:</p>
    <a id="directLink" href="https://script.google.com/macros/s/AKfycbytOd0--TxiyZV9K1-c2S7DZhd6q_Ckx9Le03KR5hpGmaTuBFP---AyMnudyKUSZWkdig/exec" class="btn" target="_blank" rel="noopener">Open Calculator</a>
  </div>

  <script>
    setTimeout(function() {
      var fallback = document.getElementById('fallbackBox');
      if (fallback) {
        fallback.style.display = 'block';
      }
    }, 4000);
  </script>
</body>
</html>
